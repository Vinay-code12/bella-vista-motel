<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 22 320 320" role="img" aria-labelledby="t">
  <title id="t">Illustrated portrait of the Bella Vista Motel AI concierge</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e8cf"/>
      <stop offset="1" stop-color="#f2d0a9"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3c7c1"/>
      <stop offset="1" stop-color="#6e9b95"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f5a30"/>
      <stop offset=".6" stop-color="#b47b45"/>
      <stop offset="1" stop-color="#d2a065"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4cba7"/>
      <stop offset="1" stop-color="#ecb994"/>
    </linearGradient>
    <linearGradient id="straw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1dcad"/>
      <stop offset="1" stop-color="#d8b77a"/>
    </linearGradient>
  </defs>

  <!-- Coastal backdrop -->
  <rect x="0" y="0" width="400" height="400" fill="url(#sky)"/>
  <circle cx="306" cy="78" r="30" fill="#f9dcaa" opacity=".85"/>
  <rect x="0" y="250" width="400" height="150" fill="url(#sea)"/>
  <path d="M0 250h400" stroke="#fbf1de" stroke-width="2" opacity=".75"/>
  <path d="M52 276q20-6 40 0M292 284q22-6 44 0M74 312q18-5 36 0" stroke="#e8f2ef" stroke-width="2" fill="none" stroke-linecap="round" opacity=".6"/>

  <!-- Hair, back layer: long beach waves -->
  <path d="M142 112C112 146 120 184 108 214c-11 30 8 50-2 80-8 24 6 46 24 58h140c18-12 32-34 24-58-10-30 9-50-2-80-12-30-4-68-34-102z" fill="url(#hair)"/>
  <path d="M120 230c-6 22 6 38 0 60M280 230c6 22-6 38 0 60" stroke="#dcab6f" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>

  <!-- Shoulders: linen shirt -->
  <path d="M74 400c4-56 38-88 92-100l34 28 34-28c54 12 88 44 92 100z" fill="#fbf6ec"/>
  <path d="M166 300l-13 34 29-7M234 300l13 34-29-7" fill="#f2eadd" stroke="#e2d9c8" stroke-width="2" stroke-linejoin="round"/>

  <!-- Neck -->
  <path d="M183 236h34v50l-17 20-17-20z" fill="#e5ab86"/>
  <path d="M183 258c11 8 23 8 34 0v28l-17 20-17-20z" fill="#d6976f" opacity=".5"/>

  <!-- Face -->
  <path d="M200 116c-36 0-61 28-61 68 0 45 29 80 61 80s61-35 61-80c0-40-25-68-61-68z" fill="url(#skin)"/>

  <!-- Front locks framing the face -->
  <path d="M148 128c-18 36-8 64-16 94-8 30 8 50-4 80 22-12 32-36 30-62-2-28 4-54 4-86z" fill="#a46c3c"/>
  <path d="M252 128c18 36 8 64 16 94 8 30-8 50 4 80-22-12-32-36-30-62 2-28-4-54-4-86z" fill="#a46c3c"/>
  <path d="M140 240c-4 18 2 32-4 50M260 240c4 18-2 32 4 50" stroke="#d8a76a" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".85"/>
  <!-- Side-swept fringe -->
  <path d="M146 140c22 8 50 2 70-14 10 12 28 18 40 16-8-20-30-34-56-34s-48 12-54 32z" fill="#a46c3c"/>

  <!-- Brows -->
  <path d="M163 164q13-7 26-2M211 162q13-5 26 2" stroke="#7a4b29" stroke-width="3.2" fill="none" stroke-linecap="round"/>

  <!-- Smiling eyes with lashes -->
  <path d="M164 186q12-11 24 0M212 186q12-11 24 0" stroke="#3a2a22" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M165 185l-6-3M235 185l6-3" stroke="#3a2a22" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Cheeks and freckles -->
  <ellipse cx="161" cy="209" rx="13" ry="8" fill="#f2938a" opacity=".38"/>
  <ellipse cx="239" cy="209" rx="13" ry="8" fill="#f2938a" opacity=".38"/>
  <g fill="#c8875f" opacity=".65">
    <circle cx="183" cy="200" r="1.5"/><circle cx="189" cy="206" r="1.3"/><circle cx="178" cy="207" r="1.2"/>
    <circle cx="217" cy="200" r="1.5"/><circle cx="211" cy="206" r="1.3"/><circle cx="222" cy="207" r="1.2"/>
    <circle cx="200" cy="202" r="1.1"/>
  </g>

  <!-- Nose -->
  <path d="M199 189q-4 15 3 19" stroke="#cf8c69" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M181 224q19 21 38 0q-19 8-38 0z" fill="#c4554b"/>
  <path d="M185 226q15 6 30 0q-15 4-30 0z" fill="#fff" opacity=".9"/>

  <!-- Earrings -->
  <circle cx="143" cy="214" r="3" fill="#d4ad55"/>
  <circle cx="257" cy="214" r="3" fill="#d4ad55"/>

  <!-- Wide-brim straw hat with forest-green band -->
  <g transform="rotate(-6 200 104)">
    <ellipse cx="200" cy="106" rx="146" ry="28" fill="url(#straw)"/>
    <ellipse cx="200" cy="106" rx="146" ry="28" fill="none" stroke="#c7a466" stroke-width="2"/>
    <path d="M138 104c0-42 27-66 62-66s62 24 62 66z" fill="#edd4a1"/>
    <path d="M139 90c38 8 84 8 122 0v14H139z" fill="#26342a"/>
    <path d="M152 64q48-10 96 0" stroke="#d6b479" stroke-width="2" fill="none" opacity=".7"/>
  </g>
</svg>
